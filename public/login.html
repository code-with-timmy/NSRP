<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Nevada State Roleplay — Staff Sign In</title>
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a1559683a239521f5263a7b/4cedc96e8_nevada_roleplay_logo.png" />
    <style>
      @font-face {
        font-family: "Coolvetica";
        src: url("/fonts/Coolvetica%20Rg.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #ffffff;
        font-family: "Coolvetica", Arial, sans-serif;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 36px 32px;
        border: 1px solid #293550;
        border-radius: 18px;
        background: #111a2e;
        text-align: center;
      }
      h1 { font-size: 30px; font-weight: 400; margin: 0 0 14px; }
      .subtitle { color: #aab7d0; margin: 0; }
      .description { color: #aab7d0; margin: 24px 0; line-height: 1.6; }
      .button {
        display: block;
        padding: 14px 18px;
        border-radius: 10px;
        background: #5865f2;
        color: #ffffff;
        text-decoration: none;
        font-size: 18px;
      }
      .button:hover { background: #4752c4; }
      .button:focus-visible { outline: 2px solid #aab7d0; outline-offset: 3px; }
      .error {
        display: none;
        margin: 0 0 20px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #7a2e3a;
        background: #2a1420;
        color: #f3c2cb;
        font-family: Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        text-align: left;
      }
      .notice { color: #7f8da8; font-size: 12px; margin: 24px 0 0; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Nevada State Roleplay</h1>
      <p class="subtitle">Staff Guide Portal</p>
      <p class="description">Sign in with Discord to verify that you have the Staff Team role.</p>
      <p class="error" id="error" role="alert"></p>
      <a class="button" id="login" href="/api/login">Continue with Discord</a>
      <p class="notice">Access is restricted to authorized NSRP staff.</p>
    </main>
    <script>
      (function () {
        var messages = {
          missing_role: "Your Discord account doesn't have the Staff Team role. If you were just given it, try again; otherwise ask Management.",
          not_member: "You need to be in the NSRP Discord server to use this site.",
          relogin: "Your Discord sign-in expired. Please sign in again.",
          expired: "That sign-in link expired. Please try again.",
          cancelled: "Discord sign-in was cancelled.",
          discord: "Couldn't reach Discord to check your role. Please try again in a minute.",
          config: "The site's Discord login isn't configured yet. Ask the site owner to check the Vercel environment variables."
        };
        var params = new URLSearchParams(window.location.search);
        var code = params.get("error");
        if (code) {
          var box = document.getElementById("error");
          box.textContent = messages[code] || "Sign-in failed. Please try again.";
          box.style.display = "block";
        }
        // Come back to the page they asked for after signing in.
        var path = window.location.pathname;
        if (path && path !== "/" && path !== "/login.html") {
          document.getElementById("login").href = "/api/login?next=" + encodeURIComponent(path);
        }
      })();
    </script>
  </body>
</html>
